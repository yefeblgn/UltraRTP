    avoid-under-roof: false
    min-y: 20
    max-y: 110
    lore:
      - "<gray>Cehennemin derinliklerinde"
      - "<gray>güvenli bir noktaya ışınlanırsın."

  end:
    enabled: true
    display-name: "<gradient:#D6A6FF:#7B2FF7><bold>The End</bold></gradient>"
    icon: END_STONE
    slot: 24
    world: world_the_end
    shape: CIRCLE
    center: FIXED
    center-x: 0
    center-z: 0
    min-radius: 1200
    max-radius: 6000
    permission: "ultrartp.region.end"
    cost: 750
    cooldown: 300
    lore:
      - "<gray>End adalarında rastgele"
      - "<gray>bir noktaya ışınlanırsın."

  yakin:
    enabled: false
    display-name: "<gradient:#FFD86B:#F39C12><bold>Yakın Keşif</bold></gradient>"
    icon: COMPASS
    slot: 30
    world: world
    shape: CIRCLE
    center: PLAYER
    center-x: 0
    center-z: 0
    min-radius: 150
    max-radius: 900
    permission: ""
    cost: 50
    cooldown: 45
    lore:
      - "<gray>Bulunduğun noktanın çevresinde"
      - "<gray>kısa mesafeli ışınlanma."

# ============================================================
#  EFEKTLER
#  Parçacık adları: Bukkit Particle enum (PORTAL, END_ROD, FLAME...)
#  Ses adları: minecraft ses anahtarı (entity.enderman.teleport)
# ============================================================
effects:
  warmup:
    particle:
      enabled: true
      type: PORTAL
      count: 6
      spiral: true
      radius: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      extra: 0.0
      color: "#8A2BE2"
      size: 1.2
    sound:
      enabled: true
      type: block.note_block.hat
      volume: 0.7
      pitch: 1.4

  countdown:
    # TITLE | ACTIONBAR | BOSSBAR | BOTH | ALL | NONE
    mode: ALL
    bossbar-color: PURPLE
    bossbar-overlay: NOTCHED_10

  searching:
    particle:
      enabled: true
      type: ENCHANT
      count: 40
      spiral: false
      radius: 1.0
      offset-x: 0.6
      offset-y: 1.0
      offset-z: 0.6
      extra: 0.4
      color: "#00D4FF"
      size: 1.0
    sound:
      enabled: true
      type: block.beacon.activate
      volume: 0.5
      pitch: 1.8

  departure:
    particle:
      enabled: true
      type: REVERSE_PORTAL
      count: 90
      spiral: false
      radius: 1.0
      offset-x: 0.4
      offset-y: 1.0
      offset-z: 0.4
      extra: 0.35
      color: "#7B2FF7"
      size: 1.0
    sound:
      enabled: true
      type: entity.enderman.teleport
      volume: 1.0
      pitch: 0.8

  arrival:
    particle:
      enabled: true
      type: END_ROD
      count: 90
      spiral: false
      radius: 1.0
      offset-x: 0.5
      offset-y: 1.0
      offset-z: 0.5
      extra: 0.12
      color: "#00D4FF"
      size: 1.0
    sound:
      enabled: true
      type: entity.player.levelup
      volume: 0.9
      pitch: 1.2

  cancel:
    particle:
      enabled: true
      type: SMOKE
      count: 25
      spiral: false
      radius: 1.0
      offset-x: 0.4
      offset-y: 0.8
      offset-z: 0.4
      extra: 0.02
      color: "#555555"
      size: 1.0
    sound:
      enabled: true
      type: block.note_block.bass
      volume: 1.0
      pitch: 0.6

# ============================================================
#  MENÜLER
# ============================================================
gui:
  main:
    rows: 5
    # /rtp yazıldığında menü açılsın mı (false -> doğrudan ışınlanır)
    open-on-plain-command: true
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
    info-slot: 4
    random-slot: 40
    close-slot: 44
    back-slot: 36
    # İkonlar (Material veya "ia:namespace:id")
    icons:
      info: PLAYER_HEAD
      random: ENDER_EYE
      close: BARRIER
      back: ARROW
