# ============================================================
#   UltraRTP  -  Rastgele Işınlanma Sistemi
#   Paper 1.21.8  |  Java 21
#   https://github.com/yefeblgn
#
#   Renk/format için MiniMessage kullanılır:
#   <red>, <#FF0000>, <gradient:#A:#B>, <bold>, <b> ...
#
#   NOT: Bu dosya UTF-8 kodlamalıdır. Düzenlerken editörünüzün
#   UTF-8 ile kaydettiğinden emin olun (Notepad++ / VS Code).
# ============================================================

general:
  # Mesaj dili -> plugins/UltraRTP/lang/<dil>.yml
  # Hazır gelenler: tr, en   (kendi dosyanı ekleyip buraya yazabilirsin)
  language: tr
  # Güvenli bir konum bulmak için maksimum deneme sayısı.
  max-attempts: 45
  # Denemeler arası bekleme (tick). Yüksek değer = daha az TPS etkisi, daha yavaş.
  attempt-delay-ticks: 1
  # Aynı anda kaç oyuncu konum araması yapabilir (chunk üretimi ağırdır).
  max-concurrent-searches: 4
  # Konsola detaylı log basar.
  debug: false
  # Cooldown/istatistik verileri kaç saniyede bir diske yazılsın.
  autosave-seconds: 300

# ============================================================
#  ENTEGRASYONLAR
#  Her biri "enabled: false" yapılarak tamamen kapatılabilir.
#  Eklenti sunucuda yoksa otomatik olarak devre dışı kalır.
# ============================================================
hooks:
  # Vault -> ekonomi (ücretli ışınlanma, /rtp back ücreti)
  vault:
    enabled: true

  # PlaceholderAPI -> %ultrartp_...% placeholder'ları + mesajlarda %papi% desteği
  placeholderapi:
    enabled: true
    # Mesaj ve menü metinlerinde diğer eklentilerin placeholder'ları da çözümlensin mi
    # (örn. lang dosyasında %vault_eco_balance% yazabilirsin)
    parse-in-messages: true

  # ItemsAdder -> menü ikonlarında özel eşya kullanımı
  # Örnek:  icon: "itemsadder:rtp_icons:portal_orb"
  #         icon: "ia:mymod:ruby"
  #         icon: "mymod:ruby"
  itemsadder:
    enabled: true
    fallback-material: ENDER_PEARL

# Önceden hazırlanan konum deposu -> ışınlanma anlık olur.
cache:
  enabled: true
  # Her bölge için depoda tutulacak hazır konum sayısı.
  size-per-region: 8
  # Kaç saniyede bir depo doldurulmaya çalışılsın.
  refill-interval-seconds: 30
  # Her turda bölge başına en fazla kaç yeni konum üretilsin.
  max-generate-per-cycle: 2
  # Sunucuda hiç oyuncu yoksa üretimi durdur.
  pause-when-empty: true

teleport:
  warmup:
    enabled: true
    seconds: 5
    # Oyuncu hareket ederse iptal edilsin mi.
    cancel-on-move: true
    # Kaç blokluk hareket iptal sayılsın.
    move-threshold: 0.6
    # Hasar alırsa iptal edilsin mi.
    cancel-on-damage: true

  cooldown:
    enabled: true
    seconds: 120
    # true  -> tek ortak bekleme süresi (tüm bölgeler için)
    # false -> her bölgenin kendi bekleme süresi ayrı işlenir
    shared: true
    # Sunucu yeniden başlatılınca bekleme süreleri korunsun mu.
    persist: true
    # ultrartp.cooldown.<isim> yetkisi olanlar için özel süreler.
    # Birden fazla yetkisi varsa en düşük süre uygulanır.
    groups:
      vip: 60
      mvp: 30

  cost:
    enabled: true
    amount: 250.0
    # Güvenli konum bulunamazsa para iade edilsin mi.
    refund-on-fail: true

  # Işınlandıktan sonra kaç saniye hasar almasın (0 = kapalı).
  invulnerability-seconds: 5
  # Işınlanma sonrası düşme hasarı sıfırlansın mı.
  reset-fall-damage: true
  # Işınlanmadan önce oyuncunun bindiği şeyden inmesi sağlansın mı.
  dismount-before: true

  # /rtp back -> bir önceki konuma geri dön
  back:
    enabled: true
    cost: 100.0
    # Kaç saniye içinde geri dönebilir (0 = sınırsız).
    expire-seconds: 300

safety:
  # Ayak/kafa hizasında bu bloklar varsa konum reddedilir.
  unsafe-blocks:
    - LAVA
    - FIRE
    - SOUL_FIRE
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - MAGMA_BLOCK
    - CACTUS
    - SWEET_BERRY_BUSH
    - WITHER_ROSE
    - POWDER_SNOW
    - POINTED_DRIPSTONE
    - LAVA_CAULDRON
    - END_PORTAL
    - END_GATEWAY
    - NETHER_PORTAL
    - COBWEB
  # Zemin olarak kabul edilmeyen bloklar.
  unsafe-ground:
    - LAVA
    - MAGMA_BLOCK
    - POWDER_SNOW
    - CACTUS
    - CAMPFIRE
    - SOUL_CAMPFIRE
    - ICE
    - BLUE_ICE
    - PACKED_ICE
  # Su üstüne/içine ışınlanabilsin mi.
  allow-water: false
  # Kafanın üzerinde blok varsa (mağara / yer altı) reddet.
  avoid-under-roof: true
  # Tavan taraması kaç blok yukarı baksın.
  roof-scan-limit: 45
  # Ayak hizasından itibaren kaç blok boşluk gerekli.
  required-air-above: 2
  min-y: -48
  max-y: 250
  # Çevrede bu yarıçapta lav/ateş varsa reddet (0 = kapalı).
  danger-scan-radius: 2
  # Dünya sınırını (worldborder) dikkate al.
  respect-world-border: true
  # Bu biyomlara ışınlandırma.
  blocked-biomes:
    - minecraft:ocean
    - minecraft:deep_ocean
    - minecraft:cold_ocean
    - minecraft:deep_cold_ocean
    - minecraft:frozen_ocean
    - minecraft:deep_frozen_ocean
    - minecraft:lukewarm_ocean
    - minecraft:deep_lukewarm_ocean
    - minecraft:warm_ocean
    - minecraft:river
    - minecraft:frozen_river
    - minecraft:beach

# ============================================================
#  BÖLGELER
#  shape  : SQUARE | CIRCLE
#  center : WORLD_SPAWN | PLAYER | FIXED
#  icon   : Material adı VEYA ItemsAdder id ("ia:namespace:id")
#  cost / cooldown / min-y / max-y : -1 = genel ayarı kullan
# ============================================================
default-region: overworld

regions:
