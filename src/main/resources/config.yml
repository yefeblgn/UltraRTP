    center: WORLD_SPAWN
    center-x: 0
    center-z: 0
    min-radius: 750
    max-radius: 7500
    permission: ""
    cost: -1
    cooldown: -1
    lore:
      - "<gray>Yüzey dünyasında rastgele"
      - "<gray>bir noktaya ışınlanırsın."

  nether:
    enabled: true
    display-name: "<gradient:#FF7A5A:#C0392B><bold>Nether</bold></gradient>"
    icon: NETHERRACK
    slot: 22
