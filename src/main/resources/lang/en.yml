# UltraRTP - English language file (MiniMessage)
# Available tags depend on the message:
# <player> <region> <time> <cost> <balance> <x> <y> <z> <world> <attempts> <value> <count> <bar>
#
# NOTE: This file must be saved as UTF-8.

prefix: "<gradient:#00D4FF:#7B2FF7><bold>RTP</bold></gradient> <dark_gray>»</dark_gray> "

general:
  no-permission: "<prefix><red>You don't have permission for that."
  player-only: "<prefix><red>This command can only be used by players."
  unknown-command: "<prefix><red>Unknown subcommand. <gray>/rtp help"
  reload-success: "<prefix><green>Configuration reloaded. <gray>(<value>ms)"
  reload-failed: "<prefix><red>Reload failed: <gray><value>"
  player-not-found: "<prefix><red><value> is not online."
  invalid-number: "<prefix><red>Enter a valid number."
  saved: "<prefix><green>Settings saved to config.yml."
  disabled-world: "<prefix><red>Random teleport is disabled in this world."

region:
  not-found: "<prefix><red>There is no region named <value>."
  disabled: "<prefix><red>This region is currently disabled."
  no-permission: "<prefix><red>You don't have access to this region."
  world-missing: "<prefix><red>The region's world (<value>) is not loaded."
  none-available: "<prefix><red>There are no regions available to you."
  list-header: "<prefix><gray>Available regions:"
  list-entry: "<dark_gray> ▪ <white><value> <dark_gray>- <gray><region>"

cooldown:
  active: "<prefix><red>You must wait <yellow><time></yellow> before teleporting again."
  reset: "<prefix><green>Cooldown reset for <player>."
  reset-all: "<prefix><green>All cooldowns have been reset. <gray>(<count> entries)"

cost:
  no-economy: "<prefix><red>No economy plugin found, cannot charge."
  insufficient: "<prefix><red>Not enough money. <gray>Required: <yellow><cost></yellow> <dark_gray>|</dark_gray> <gray>Balance: <yellow><balance>"
  charged: "<prefix><gray><yellow><cost></yellow> <gray>has been withdrawn."
  refunded: "<prefix><green><cost> <gray>refunded."

warmup:
  started: "<prefix><gray>Teleporting in <yellow><time></yellow>. <dark_gray>(don't move!)"
  cancelled-move: "<prefix><red>Teleport cancelled because you moved."
  cancelled-damage: "<prefix><red>Teleport cancelled because you took damage."
  cancelled: "<prefix><red>Teleport cancelled."
  countdown-title: "<gradient:#00D4FF:#7B2FF7><bold><time></bold></gradient>"
  countdown-subtitle: "<gray>Teleporting... <dark_gray>don't move"
  countdown-actionbar: "<gray>Teleport <dark_gray>[<aqua><bar><dark_gray>] <white><time>s"
  bossbar: "<aqua>Teleporting <dark_gray>| <white><time>s"

search:
  started: "<prefix><gray>Searching for a safe location..."
  failed: "<prefix><red>No safe location found after <attempts> attempts. Try again."
  busy: "<prefix><red>The server is busy right now, try again in a few seconds."
  already: "<prefix><red>You already have a teleport in progress."

teleport:
  success: "<prefix><green>Teleported to <region><gray>. <dark_gray>(<x>, <y>, <z>)"
  success-title: "<gradient:#7CFC8F:#2ECC71><bold>Teleported!</bold></gradient>"
  success-subtitle: "<gray><x><dark_gray>, <gray><y><dark_gray>, <gray><z>"
  other: "<prefix><green><player> <gray>has been teleported."
  failed: "<prefix><red>Teleport failed."
  invulnerable: "<prefix><gray>You are invulnerable for <time>."

back:
  disabled: "<prefix><red>The back feature is disabled."
  none: "<prefix><red>You have no location to return to."
  expired: "<prefix><red>Your return window has expired."
  success: "<prefix><green>Returned to your previous location."

gui:
  main-title: "<gradient:#00D4FF:#7B2FF7><bold>Random Teleport</bold></gradient>"
  admin-title: "<gradient:#FF512F:#DD2476><bold>RTP Admin Panel</bold></gradient>"
  admin-teleport-title: "<gradient:#FF512F:#DD2476><bold>Teleport Settings</bold></gradient>"
  admin-safety-title: "<gradient:#FF512F:#DD2476><bold>Safety Settings</bold></gradient>"
  admin-effects-title: "<gradient:#FF512F:#DD2476><bold>Effect Settings</bold></gradient>"
  admin-regions-title: "<gradient:#FF512F:#DD2476><bold>Regions</bold></gradient>"
  admin-region-title: "<gradient:#FF512F:#DD2476><bold>Region:</bold></gradient> <white><region>"

  no-permission-lore: "<red>✖ No permission"
  cooldown-lore: "<red>✖ Cooldown: <yellow><time>"
  cost-lore: "<gray>Cost: <gold><cost>"
  free-lore: "<green>Free"
  click-lore: "<yellow>» Click to teleport"
  disabled-lore: "<dark_red>✖ Disabled"
  world-lore: "<gray>World: <white><world>"
  radius-lore: "<gray>Radius: <white><value>"

  info-name: "<gradient:#00D4FF:#7B2FF7><bold>Your Info</bold></gradient>"
  info-lore:
    - "<dark_gray>▪ <gray>Player: <white><player>"
    - "<dark_gray>▪ <gray>Balance: <gold><balance>"
    - "<dark_gray>▪ <gray>Total teleports: <aqua><count>"
    - "<dark_gray>▪ <gray>Cooldown: <yellow><time>"
  random-name: "<gradient:#FFD86B:#F39C12><bold>Random Region</bold></gradient>"
  random-lore:
    - "<gray>Teleports you to a random"
    - "<gray>region you have access to."
    - ""
    - "<yellow>» Click to teleport"
  close-name: "<red><bold>Close</bold>"
  back-name: "<gray><bold>« Back</bold>"
  return-name: "<gradient:#D6A6FF:#7B2FF7><bold>Return To Previous</bold></gradient>"
  return-lore:
    - "<gray>Return to where you were"
    - "<gray>before the last teleport."
    - ""
    - "<gray>Cost: <gold><cost>"
    - "<yellow>» Click to return"

admin:
  panel-open: "<prefix><gray>Opening admin panel..."
  value-set: "<prefix><gray><value> <dark_gray>➜ <white><count>"
  cache-info: "<prefix><gray>Cache: <white><value>"
  cache-cleared: "<prefix><green>Location cache cleared."
  cache-refilling: "<prefix><gray>Refilling location cache..."
  input-prompt: "<prefix><yellow>Type the new value in chat. <gray>Type <white>cancel <gray>to abort."
  input-cancelled: "<prefix><red>Cancelled."
  input-timeout: "<prefix><red>Timed out, cancelled."

  gui:
    enabled: "<green>Enabled"
    disabled: "<red>Disabled"
    toggle-hint: "<yellow>» Click to toggle"
    number-hint:
      - "<dark_gray>» <gray>Left click: <white>+<value>"
      - "<dark_gray>» <gray>Right click: <white>-<value>"
      - "<dark_gray>» <gray>Shift + click: <white>x5"
      - "<dark_gray>» <gray>Middle click: <white>type value"
    teleport-name: "<gradient:#00D4FF:#7B2FF7><bold>Teleport Settings</bold></gradient>"
    teleport-lore: "<gray>Cooldown, warmup, cost"
    safety-name: "<gradient:#7CFC8F:#2ECC71><bold>Safety Settings</bold></gradient>"
    safety-lore: "<gray>Lava, water, roof, biomes"
    effects-name: "<gradient:#FFD86B:#F39C12><bold>Effect Settings</bold></gradient>"
    effects-lore: "<gray>Particles, sounds, countdown"
    regions-name: "<gradient:#D6A6FF:#7B2FF7><bold>Region Manager</bold></gradient>"
    regions-lore: "<gray>Edit regions"
    cache-name: "<gradient:#00D4FF:#0088CC><bold>Location Cache</bold></gradient>"
    cache-lore: "<gray>Left: refill <dark_gray>| <gray>Right: clear"
    reload-name: "<gradient:#FF512F:#DD2476><bold>Reload</bold></gradient>"
    reload-lore: "<gray>Reloads config.yml and language"
    stats-name: "<gradient:#00D4FF:#7B2FF7><bold>Statistics</bold></gradient>"

    warmup-enabled: "Teleport Warmup"
    warmup-seconds: "Warmup Seconds"
    warmup-move: "Cancel On Move"
    warmup-damage: "Cancel On Damage"
    cooldown-enabled: "Cooldown"
    cooldown-seconds: "Cooldown Seconds"
    cooldown-shared: "Shared Cooldown"
    cost-enabled: "Economy Cost"
    cost-amount: "Teleport Cost"
    cost-refund: "Refund On Failure"
    invulnerability: "Invulnerability (s)"
    back-enabled: "Back Feature (/rtp back)"
    back-cost: "Back Cost"
    max-attempts: "Max Attempts"
    cache-enabled: "Location Cache"
    cache-size: "Cache Size"
    allow-water: "Allow Water"
    avoid-roof: "Avoid Under Roof"
    roof-scan: "Roof Scan Limit"
    air-above: "Required Air Above"
    min-y: "Minimum Y"
    max-y: "Maximum Y"
    danger-radius: "Danger Scan Radius"
    world-border: "Respect World Border"
    region-enabled: "Region Enabled"
    region-min-radius: "Minimum Radius"
    region-max-radius: "Maximum Radius"
    region-cost: "Region Cost"
    region-cooldown: "Region Cooldown"
    region-world: "World"
    region-name: "Display Name"
    region-teleport: "Test Teleport"
    countdown-mode: "Countdown Display"
    fx-warmup-particle: "Warmup Particle"
    fx-warmup-sound: "Warmup Sound"
    fx-searching-particle: "Search Particle"
    fx-searching-sound: "Search Sound"
    fx-departure-particle: "Departure Particle"
    fx-departure-sound: "Departure Sound"
    fx-arrival-particle: "Arrival Particle"
    fx-arrival-sound: "Arrival Sound"
    fx-cancel-particle: "Cancel Particle"
    fx-cancel-sound: "Cancel Sound"

help:
  - "<dark_gray><strikethrough>                                        "
  - "<gradient:#00D4FF:#7B2FF7><bold>UltraRTP</bold></gradient> <dark_gray>- <gray>Commands"
  - ""
  - "<aqua>/rtp <dark_gray>- <gray>Open menu / teleport"
  - "<aqua>/rtp <region> <dark_gray>- <gray>Teleport to a specific region"
  - "<aqua>/rtp menu <dark_gray>- <gray>Open the teleport menu"
  - "<aqua>/rtp back <dark_gray>- <gray>Return to previous location"
  - "<aqua>/rtp cancel <dark_gray>- <gray>Cancel an ongoing teleport"
  - "<aqua>/rtp list <dark_gray>- <gray>List regions"
  - "<dark_gray><strikethrough>                                        "

help-admin:
  - "<dark_gray><strikethrough>                                        "
  - "<gradient:#FF512F:#DD2476><bold>UltraRTP</bold></gradient> <dark_gray>- <gray>Admin"
  - ""
  - "<red>/rtpadmin <dark_gray>- <gray>Open the admin panel"
  - "<red>/rtpadmin reload <dark_gray>- <gray>Reload configuration"
  - "<red>/rtpadmin cache <info|clear|refill> <dark_gray>- <gray>Location cache"
  - "<red>/rtpadmin cooldown reset <player|*> <dark_gray>- <gray>Reset cooldowns"
  - "<red>/rtpadmin tp <player> [region] <dark_gray>- <gray>Teleport a player"
  - "<dark_gray><strikethrough>                                        "
